name: Check Log Operativo

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  check-log-operativo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica aggiornamento log operativo
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD | grep -q LOG_OPERATIVO.md || (echo "LOG_OPERATIVO.md non aggiornato!"; exit 1)