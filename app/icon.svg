<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sfondo -->
  <circle cx="32" cy="32" r="32" fill="#4f46e5"/>
  <!-- Orbita 1 (orizzontale) -->
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="white" stroke-width="2.2"/>
  <!-- Orbita 2 (60°) -->
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="white" stroke-width="2.2" transform="rotate(60 32 32)"/>
  <!-- Orbita 3 (-60°) -->
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="white" stroke-width="2.2" transform="rotate(-60 32 32)"/>
  <!-- Nucleo -->
  <circle cx="32" cy="32" r="5" fill="white"/>
</svg>
